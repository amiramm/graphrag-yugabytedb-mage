# Hybrid Graph RAG on YugabyteDB 2026.1.1 (GA) with vector + MAGE.
#
# `db` runs a single-node YugabyteDB from the **official** multi-arch image —
# the 2026.1.1 line publishes native `arm64` as well as `amd64`, so there is
# nothing to build and no release tarball to fetch. `db-init` applies the
# schema once the database is healthy. The Python demo (src/) talks to YSQL on
# localhost:5433.
#
# Override the version with YB_IMAGE, e.g.
#   YB_IMAGE=yugabytedb/yugabyte:2026.1.1.0-b91 docker compose up -d
# To run a pre-release/dev tarball instead, see db/README.md.
services:
  db:
    image: ${YB_IMAGE:-yugabytedb/yugabyte:2026.1.1.1-b2}
    hostname: db
    command:
      - bin/yugabyted
      - start
      - --daemon=false
      - --tserver_flags=ysql_yb_enable_mage=true
      - --master_flags=ysql_yb_enable_mage=true
    ports:
      - "5433:5433"    # YSQL
      - "15433:15433"  # YugabyteDB UI
      - "7000:7000"    # master web UI
    healthcheck:
      test: ["CMD-SHELL", "ysqlsh -h $(hostname -i) -U yugabyte -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  db-init:
    image: ${YB_IMAGE:-yugabytedb/yugabyte:2026.1.1.1-b2}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["ysqlsh", "-h", "db", "-U", "yugabyte", "-v", "ON_ERROR_STOP=1", "-f", "/sql/00_schema.sql"]
    volumes:
      - ./sql:/sql:ro
    restart: "no"
