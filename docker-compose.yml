# Hybrid Graph RAG on YugabyteDB 2026.1.1 with vector + MAGE.
#
# `db` runs a single-node YugabyteDB from the official multi-arch image, which
# covers both arm64 and amd64, so there is nothing to build. The two
# ysql_yb_enable_mage flags turn on MAGE, a Tech Preview feature. `db-init`
# applies the schema once the database is healthy. The Python demo (src/) talks
# to YSQL on localhost:5433.
#
# To run a different version, set YB_IMAGE, for example:
#   YB_IMAGE=yugabytedb/yugabyte:2026.1.1.0-b91 docker compose up -d
# To build an image yourself, see db/README.md.
services:
  db:
    image: ${YB_IMAGE:-yugabytedb/yugabyte:2026.1.1.1-b2}
    hostname: db
    command:
      - bin/yugabyted
      - start
      - --daemon=false
      - --tserver_flags=ysql_yb_enable_mage=true
      - --master_flags=ysql_yb_enable_mage=true
    ports:
      - "5433:5433"    # YSQL
      - "15433:15433"  # YugabyteDB UI
      - "7000:7000"    # master web UI
    healthcheck:
      test: ["CMD-SHELL", "ysqlsh -h $(hostname -i) -U yugabyte -c 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s

  db-init:
    image: ${YB_IMAGE:-yugabytedb/yugabyte:2026.1.1.1-b2}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["ysqlsh", "-h", "db", "-U", "yugabyte", "-v", "ON_ERROR_STOP=1", "-f", "/sql/00_schema.sql"]
    volumes:
      - ./sql:/sql:ro
    restart: "no"
